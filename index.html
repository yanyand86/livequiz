<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#005EB8">
<meta name="robots" content="noindex">
<title>Live quiz · Escalation pathways</title>
<style>
:root{--blue:#005EB8;--dk:#003087;--green:#009639;--red:#DA291C;--yellow:#FFB81C;--orange:#ED8B00;--teal:#00827F;
--purple:#330071;--text:#212B32;--grey:#425563;--mid:#768692;--pale:#E8EDEE;--bg:#F0F4F5;--white:#fff;--lb:#E8F1FA;
--gt:#EAF6EE;--rt:#FDEEEC;--yt:#FFF6DB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;
-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}
/* ---------- shared header ---------- */
.bar{background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;
padding-top:max(10px,env(safe-area-inset-top))}
.bar .t{font-weight:700;font-size:16px;flex:1;line-height:1.2}
.bar .t small{display:block;font-weight:400;opacity:.85;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#9be29b;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.dot.off{background:#ffb3ad}
.status{font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
/* ---------- participant ---------- */
.p-main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:18px}
.kicker{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
.q{font-size:20px;font-weight:700;line-height:1.3;margin:0 0 14px}
.sub{color:var(--grey);font-size:15px;line-height:1.4;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--pale);
border-radius:12px;padding:12px 14px;min-height:58px;font-size:16px;line-height:1.3;transition:transform .08s,border-color .15s}
.opt:active{transform:scale(.99)}
.opt .l{flex:0 0 32px;height:32px;border-radius:50%;background:var(--lb);color:var(--blue);font-weight:700;display:grid;
place-items:center}
.opt.sel{border-color:var(--blue);background:var(--lb)}
.opt.sel .l{background:var(--blue);color:#fff}
.opt.right{border-color:var(--green);background:var(--gt)}
.opt.right .l{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--rt)}
.opt.wrong .l{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.units .opt{justify-content:center;font-weight:700}
.go{display:block;width:100%;margin-top:16px;background:var(--green);color:#fff;border:0;border-radius:12px;padding:15px;
font-size:18px;font-weight:700;box-shadow:0 3px 0 #006b29}
.go[disabled]{background:#b7c3c8;box-shadow:none;cursor:default}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;font-size:15px;padding:10px 0;display:block;
margin:8px auto 0}
.progress{display:flex;gap:6px;margin:0 0 12px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--pale)}
.progress i.on{background:var(--blue)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{flex-direction:column;justify-content:center;gap:4px;text-align:center;padding:10px 4px;font-size:13px}
.scale .opt b{font-size:22px}
.big{font-size:54px;line-height:1;margin:8px 0;text-align:center}
.center{text-align:center}
.feedback{border-radius:12px;padding:14px;margin-top:14px;font-size:15px;line-height:1.45}
.feedback.ok{background:var(--gt);border:2px solid var(--green)}
.feedback.no{background:var(--rt);border:2px solid var(--red)}
.feedback.na{background:var(--yt);border:2px solid var(--yellow)}
.feedback b.h{display:block;font-size:18px;margin-bottom:4px}
.locked{margin-top:14px;padding:14px;border-radius:12px;background:var(--lb);color:var(--dk);font-weight:700;text-align:center}
.pulse{display:inline-flex;gap:6px;margin:12px auto}
.pulse i{width:10px;height:10px;border-radius:50%;background:var(--blue);animation:pb 1.2s infinite ease-in-out}
.pulse i:nth-child(2){animation-delay:.15s}.pulse i:nth-child(3){animation-delay:.3s}
@keyframes pb{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.tbar{height:6px;border-radius:3px;background:var(--pale);overflow:hidden;margin:0 0 12px}
.tbar i{display:block;height:100%;background:var(--orange);transition:width .9s linear}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:10px 0}
.score div b{display:block;font-size:38px;color:var(--blue)}
.score div span{font-size:13px;color:var(--grey)}
.score .arrow{font-size:28px;color:var(--mid)}
.note{font-size:13px;color:var(--grey);text-align:center;margin-top:14px;line-height:1.4}
.err{background:var(--rt);border:2px solid var(--red);border-radius:12px;padding:16px;line-height:1.45}
/* ---------- presenter ---------- */
body.host{background:#0b2545;color:#fff;overflow:hidden}
.h-wrap{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.h-top{display:flex;align-items:center;gap:2vw;padding:1.2vh 2vw;background:var(--blue)}
.h-top .t{font-size:clamp(16px,1.5vw,30px);font-weight:700;flex:1}
.h-top .t small{font-weight:400;opacity:.85;margin-left:.6em}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:.4em .9em;font-size:clamp(13px,1.15vw,24px);
display:flex;align-items:center;gap:.5em;white-space:nowrap}
.h-main{padding:2.5vh 3vw;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.h-foot{display:flex;align-items:center;gap:1vw;padding:1.2vh 2vw;background:rgba(255,255,255,.06)}
.h-foot .hint{flex:1;font-size:clamp(12px,.95vw,20px);opacity:.7}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:.7em 1.2em;
font-size:clamp(14px,1.2vw,26px);font-weight:700}
.hbtn.primary{background:var(--green)}
.hbtn.warn{background:var(--red)}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;flex:1;min-height:0}
.qrbox{background:#fff;border-radius:2vw;padding:2vw;text-align:center;color:var(--dk)}
.qrbox svg{width:min(34vw,56vh);height:min(34vw,56vh);display:block}
.overlay .qrbox svg{width:min(60vw,72vh);height:min(60vw,72vh)}
.qrbox .u{font-size:clamp(16px,1.9vw,40px);font-weight:700;margin-top:1.2vh;color:var(--blue)}
.lobby h1{font-size:clamp(30px,4.2vw,90px);margin:0 0 1vh;line-height:1.05}
.lobby p{font-size:clamp(16px,1.8vw,38px);opacity:.9;margin:0 0 3vh;line-height:1.35}
.counters{display:flex;gap:2vw;margin-bottom:3vh}
.counter{background:rgba(255,255,255,.1);border-radius:1.4vw;padding:1.6vh 2vw;min-width:12vw}
.counter b{display:block;font-size:clamp(34px,5vw,110px);line-height:1}
.counter span{font-size:clamp(13px,1.2vw,26px);opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:.8vw}
.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:.45em 1em;font-size:clamp(13px,1.25vw,28px)}
.qhead{display:flex;align-items:center;gap:2vw;margin-bottom:2vh}
.qnum{font-size:clamp(14px,1.4vw,30px);font-weight:700;color:var(--yellow);letter-spacing:.06em;text-transform:uppercase}
.qtext{font-size:clamp(22px,2.9vw,64px);font-weight:700;line-height:1.2;margin:0 0 3vh}
.answered{margin-left:auto;font-size:clamp(14px,1.5vw,32px);opacity:.9}
.ring{width:clamp(44px,4.6vw,100px);height:clamp(44px,4.6vw,100px);position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(16px,1.6vw,34px)}
.hopts{display:grid;gap:1.6vh;flex:1;align-content:start}
.hopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.4vw;background:rgba(255,255,255,.08);
border-radius:1.2vw;padding:1.6vh 1.6vw;position:relative;overflow:hidden;font-size:clamp(16px,1.9vw,42px);line-height:1.25}
.hopt .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.14);width:0;transition:width .8s ease}
.hopt>*:not(.fill){position:relative}
.hopt .l{width:2.2em;height:2.2em;border-radius:50%;background:#fff;color:var(--dk);font-weight:700;display:grid;
place-items:center;font-size:.8em}
.hopt .n{font-weight:700;min-width:4.5em;text-align:right;opacity:0}
.reveal .hopt .n{opacity:1}
.reveal .hopt{opacity:.55}
.reveal .hopt.right{opacity:1;background:rgba(0,150,57,.35);box-shadow:inset 0 0 0 3px #7be495}
.reveal .hopt.right .fill{background:rgba(0,150,57,.55)}
.reveal .hopt.right .l{background:var(--green);color:#fff}
.why{margin-top:2vh;background:rgba(255,255,255,.1);border-left:.5vw solid var(--yellow);border-radius:.8vw;
padding:1.6vh 1.6vw;font-size:clamp(14px,1.55vw,34px);line-height:1.4}
.res{display:grid;grid-template-columns:1.1fr 1fr;gap:2.5vw;flex:1;min-height:0}
.res h1{font-size:clamp(26px,3.4vw,74px);margin:0 0 2vh}
.kpi{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(255,255,255,.08);
border-radius:1.4vw;padding:2vh 2vw;margin-bottom:2vh;text-align:center}
.kpi b{display:block;font-size:clamp(34px,5.2vw,120px);line-height:1}
.kpi span{font-size:clamp(12px,1.15vw,26px);opacity:.85}
.kpi .ar{font-size:clamp(24px,3vw,64px);opacity:.6}
.kpi .after b{color:#7be495}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
.mini .kpi b{font-size:clamp(24px,3.2vw,70px)}
.bars{background:rgba(255,255,255,.06);border-radius:1.4vw;padding:2vh 1.6vw;display:grid;gap:2.2vh;align-content:start}
.bars h2,.league h2{font-size:clamp(14px,1.35vw,30px);margin:0 0 .6vh;opacity:.85;font-weight:700}
.brow{display:grid;grid-template-columns:minmax(7em,15vw) 1fr;gap:1vw;align-items:center;font-size:clamp(12px,1.2vw,27px)}
.brow .lab{font-weight:700}
.btrack{display:grid;gap:.4vh}
.b{height:2.6vh;min-height:12px;border-radius:999px;background:rgba(255,255,255,.12);position:relative}
.b i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width 1s ease}
.b.pre i{background:#9fb4c3}.b.post i{background:#7be495}
.b em{position:absolute;right:.4em;top:50%;transform:translateY(-50%);font-style:normal;font-size:.85em}
.legend{display:flex;gap:1.6vw;font-size:clamp(11px,1vw,22px);opacity:.85}
.legend i{display:inline-block;width:.9em;height:.9em;border-radius:50%;margin-right:.35em;vertical-align:-.1em}
.league{margin-top:2vh;background:rgba(255,255,255,.06);border-radius:1.4vw;padding:2vh 1.6vw}
.lrow{display:grid;grid-template-columns:2.2em 1fr auto;gap:1vw;align-items:center;font-size:clamp(13px,1.3vw,28px);
padding:.5vh 0}
.lrow .pos{font-weight:700;color:var(--yellow)}
.gate{max-width:640px;margin:8vh auto;background:#fff;color:var(--text);border-radius:16px;padding:28px}
.gate h1{margin:0 0 10px;color:var(--dk);font-size:26px}
.gate p{line-height:1.5;color:var(--grey)}
.gate input{width:100%;font-size:20px;padding:12px;border:2px solid var(--pale);border-radius:10px;margin:6px 0 12px}
.gate .go{margin-top:6px}
.menu{position:fixed;right:2vw;bottom:9vh;background:#fff;color:var(--text);border-radius:12px;
box-shadow:0 8px 30px rgba(0,0,0,.35);padding:8px;display:grid;gap:4px;min-width:260px;z-index:5}
.menu button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-size:16px}
.menu button:hover{background:var(--pale)}
.overlay{position:fixed;inset:0;background:rgba(11,37,69,.96);display:grid;place-items:center;z-index:6}
.toast{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);background:#fff;color:var(--text);padding:12px 18px;
border-radius:10px;font-weight:700;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.3)}
/* ---------- results screen (mode=screen): embedded in a wide box on a slide ---------- */
body.screen{overflow:hidden}
.s-wrap{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:2.4vh 1.8vw 2vh;gap:2vh}
.s-top{display:flex;align-items:center;gap:1.4vw;font-size:3.4vh;white-space:nowrap}
.s-title{font-weight:700;font-size:4.6vh}
.s-status{opacity:.9}
.s-join{margin-left:auto;display:flex;align-items:center;gap:.8vw;font-size:2.9vh;opacity:.95}
.s-join .qr{background:#fff;border-radius:.8vh;padding:.5vh;line-height:0}
.s-join .qr svg{width:10vh;height:10vh}
.res.res3{grid-template-columns:1fr 1.55fr 1.05fr;gap:1.6vw;min-height:0;align-items:start}
.res3 .kpi{padding:1.6vh 1vw;margin-bottom:1.6vh;border-radius:1.6vh}
.res3 .kpi b{font-size:9vh}
.res3 .kpi span{font-size:2.5vh}
.res3 .kpi .ar{font-size:5.5vh}
.res3 .mini{grid-template-columns:1fr;gap:0}
.res3 .mini .kpi b{font-size:6vh}
.res3 .bars{padding:1.8vh 1.2vw;gap:2vh;border-radius:1.6vh}
.res3 .bars h2,.res3 .league h2{font-size:2.8vh;margin-bottom:.4vh}
.res3 .brow{font-size:2.7vh;grid-template-columns:minmax(5.5em,12vw) 1fr;gap:.8vw}
.res3 .b{height:2.6vh;min-height:8px}
.res3 .legend{font-size:2.4vh}
.res3 .league{margin-top:0;padding:1.8vh 1.2vw;border-radius:1.6vh;overflow:hidden}
.res3 .lrow{font-size:3vh;padding:.45vh 0}
.s-msg{height:100vh;display:grid;place-items:center;text-align:center;font-size:4vh;padding:4vh}
.s-msg small{display:block;font-size:2.6vh;opacity:.75;margin-top:1.5vh}
@media (max-width:380px){.q{font-size:18px}.opt{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const SET = SETS[SESSION_SETS[SID] || DEFAULT_SESSION] || SETS[DEFAULT_SESSION];
const ROOT = "lq/" + SID;
const JOIN_URL = location.origin + location.pathname + (SID === DEFAULT_SESSION ? "" : "?s=" + SID);
const JOIN_TEXT = (location.host + location.pathname).replace(/\/(index\.html)?$/, "") + (SID === DEFAULT_SESSION ? "" : "?s=" + SID);
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const L = i => "abcd"[i];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let DB = null;            // adapter
let clockOffset = 0;      // server - local (ms)
const now = () => Date.now() + clockOffset;
let connected = true;

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ---------------------------------------------------------------- data adapters
async function firebaseAdapter() {
  const base = "https://www.gstatic.com/firebasejs/" + FB_VERSION + "/";
  const [fa, fd, fau] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-database.js"),
                                           import(base + "firebase-auth.js")]);
  const fb = fa.getApps().length ? fa.getApp() : fa.initializeApp(FIREBASE_CONFIG);
  const auth = fau.getAuth(fb);
  const cred = await fau.signInAnonymously(auth);
  const db = fd.getDatabase(fb);
  const R = p => fd.ref(db, p);
  return {
    uid: cred.user.uid,
    listen: (p, cb, err) => fd.onValue(R(p), s => cb(s.val()), e => err && err(e)),
    set: (p, v) => fd.set(R(p), v),
    update: (p, o) => fd.update(R(p), o),
    remove: p => fd.remove(R(p)),
    get: p => fd.get(R(p)).then(s => s.val()),
    ts: () => fd.serverTimestamp(),
    onConnected: cb => fd.onValue(R(".info/connected"), s => cb(!!s.val())),
    onOffset: cb => fd.onValue(R(".info/serverTimeOffset"), s => cb(Number(s.val()) || 0))
  };
}

function demoAdapter() {
  // Same-browser demo: every tab shares localStorage; each tab is its own "device".
  const KEY = "lqdemo-db";
  let uid = sessionStorage.getItem("lqdemo-uid");
  if (!uid) { uid = ({ host: "host-", screen: "scr-" }[MODE] || "p-") + Math.random().toString(36).slice(2, 9); sessionStorage.setItem("lqdemo-uid", uid); }
  const read = () => { try { return JSON.parse(store.get(KEY) || "{}"); } catch (e) { return {}; } };
  const parts = p => p.split("/").filter(Boolean);
  const getAt = (obj, p) => parts(p).reduce((o, k) => (o && typeof o === "object") ? o[k] : undefined, obj);
  const TS = { ".sv": "timestamp" };
  const resolve = v => (v && typeof v === "object") ? (v[".sv"] === "timestamp" ? Date.now()
                    : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, resolve(x)]))) : v;
  const prune = o => { if (!o || typeof o !== "object") return o; for (const k of Object.keys(o)) { o[k] = prune(o[k]);
                       if (o[k] === null || o[k] === undefined || (typeof o[k] === "object" && !Object.keys(o[k]).length)) delete o[k]; } return o; };
  const setAt = (obj, p, v) => { const ks = parts(p); let o = obj; ks.slice(0, -1).forEach(k => { if (!o[k] || typeof o[k] !== "object") o[k] = {}; o = o[k]; });
                                 o[ks[ks.length - 1]] = v; };
  const listeners = new Set();
  const fire = () => { const d = read(); listeners.forEach(l => l.cb(getAt(d, l.p) ?? null)); };
  window.addEventListener("storage", e => { if (e.key === KEY) fire(); });
  const writeOnce = p => /\/ans\/(pre|post)\/[^/]+\/[^/]+$/.test(p);
  const isHostPath = p => /\/(state|seen$|ans$)/.test(p) && !/\/seen\/[^/]+$/.test(p);
  const commit = (fn) => { const d = read(); fn(d); store.set(KEY, JSON.stringify(prune(d))); setTimeout(fire, 0); };
  return {
    uid,
    listen: (p, cb) => { const l = { p, cb }; listeners.add(l); setTimeout(() => cb(getAt(read(), p) ?? null), 0); return () => listeners.delete(l); },
    set: async (p, v) => {
      const d = read();
      if (writeOnce(p) && getAt(d, p) !== undefined) throw new Error("PERMISSION_DENIED (demo: write-once)");
      if (p.endsWith("/hostkey") && getAt(d, p) !== undefined) throw new Error("PERMISSION_DENIED");
      if (/\/hosts\//.test(p) && v !== getAt(d, p.replace(/\/hosts\/.*/, "/hostkey"))) throw new Error("PERMISSION_DENIED");
      commit(x => setAt(x, p, resolve(v)));
    },
    update: async (p, o) => { for (const [k, v] of Object.entries(o)) await DB.set(p + "/" + k, v); },
    remove: async p => commit(x => setAt(x, p, null)),
    get: async p => getAt(read(), p) ?? null,
    ts: () => TS,
    onConnected: cb => cb(true),
    onOffset: cb => cb(0)
  };
}

function configReady() {
  return FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL;
}

async function connect() {
  if (DEMO) return demoAdapter();
  if (!configReady()) throw Object.assign(new Error("not-configured"), { code: "not-configured" });
  return firebaseAdapter();
}

function friendlyError(e) {
  const c = (e && (e.code || e.message)) || String(e);
  if (c === "not-configured") return "This quiz page hasn't been connected to its database yet. Presenter: paste the Firebase config into index.html (see the setup guide).";
  if (/admin-restricted-operation|operation-not-allowed/.test(c)) return "Anonymous sign-in is switched off in Firebase. Presenter: Firebase console → Authentication → Sign-in method → Anonymous → Enable.";
  if (/unauthorized-domain|requests-from-referer|API_KEY_HTTP_REFERRER_BLOCKED/i.test(c)) return "This web address isn't allowed by the Firebase project. Presenter: add it under Authentication → Settings → Authorised domains.";
  if (/network-request-failed|Failed to fetch|import/i.test(c)) return "Can't reach the quiz server. Check the Wi-Fi or mobile data, then reload the page.";
  if (/too-many-requests/.test(c)) return "Too many people joined from one network at once. Wait a minute and reload.";
  if (/PERMISSION_DENIED/i.test(c)) return "The database refused that. Presenter: check the database rules from the setup guide are published.";
  return "Something went wrong: " + c;
}

function scoreOf(ans, ids) {
  let right = 0, done = 0;
  for (const id of ids) { const a = ans && ans[id]; if (a) { done++; if (a === SET.questions[id].answer) right++; } }
  return { right, done };
}

// ====================================================================== FINAL QUIZ: OPEN?
const opensAt = () => { const x = FINAL_OPENS[SID] ? Date.parse(FINAL_OPENS[SID]) : NaN; return isNaN(x) ? null : x; };
function finalOpen(st) {
  st = st || {};
  if (st.p === "final") return true;
  if (st.hold) return false;
  const t = opensAt();
  return t !== null && now() >= t;
}
function opensText() {
  const t = opensAt();
  if (t === null) return "when the presenter opens it";
  const d = new Date(t);
  const time = d.toLocaleTimeString("en-GB", { timeZone: "Europe/London", hour: "2-digit", minute: "2-digit" });
  const day = d.toLocaleDateString("en-GB", { timeZone: "Europe/London", weekday: "short", day: "numeric", month: "short" });
  return "at " + time + " on " + day;
}

// ====================================================================== PARTICIPANT
const P = { state: null, pre: null, post: null, sel: null, unitSkip: false, wrote: {}, started: false, checked: null,
            open: null, local: {} };

async function player() {
  renderShell("Connecting…");
  try { DB = await connect(); } catch (e) { return showError(e); }
  DB.onConnected(c => { connected = c; updateStatus(); });
  DB.onOffset(o => clockOffset = o);
  DB.set(ROOT + "/seen/" + DB.uid, DB.ts()).catch(() => {});
  DB.listen(ROOT + "/state", v => { P.state = v || { p: "pre" }; renderPlayer(); }, showError);
  DB.listen(ROOT + "/ans/pre/" + DB.uid, v => { P.pre = v || {}; renderPlayer(); }, showError);
  DB.listen(ROOT + "/ans/post/" + DB.uid, v => { P.post = Object.assign({}, v || {}, P.local); renderPlayer(); }, showError);
  setInterval(() => { if (P.state && finalOpen(P.state) !== P.open) renderPlayer(); }, 1000);
}

function renderShell(msg) {
  app.innerHTML = `<div class="bar"><div class="t">${esc(SET.title)}<small>Live quiz · session ${esc(SID)}${DEMO ? " · demo" : ""}</small></div>
    <div class="status" id="st"><span class="dot"></span><span>Live</span></div></div>
    <main class="p-main" id="pm"><div class="card center"><p class="sub">${esc(msg)}</p><div class="pulse"><i></i><i></i><i></i></div></div></main>`;
}

function updateStatus() {
  const st = document.getElementById("st");
  if (st) st.innerHTML = `<span class="dot ${connected ? "" : "off"}"></span><span>${connected ? "Live" : "Reconnecting…"}</span>`;
}

function showError(e) {
  console.error(e);
  const pm = document.getElementById("pm") || app;
  pm.innerHTML = `<div class="err"><b>Sorry — the quiz can't start on this device.</b><br>${esc(friendlyError(e))}</div>
    <button class="link" onclick="location.reload()">Try again</button>`;
}

function unitOf() { return (P.pre && P.pre.u) || (P.post && P.post.u) || null; }

async function write(phase, key, val) {
  const tag = phase + key;
  if (P.wrote[tag]) return;
  P.wrote[tag] = true;
  try { await DB.set(`${ROOT}/ans/${phase}/${DB.uid}/${key}`, val); }
  catch (e) { if (!/PERMISSION_DENIED|write-once/i.test(String(e && (e.code || e.message)))) { P.wrote[tag] = false; toast("Not saved — check your connection"); } }
}

function renderPlayer() {
  const pm = document.getElementById("pm");
  if (!pm || P.pre === null || P.post === null || !P.state) return;
  P.open = finalOpen(P.state);
  if (P.open) return renderFinal(pm);
  renderPre(pm);
}

function renderUnit(pm, phase) {
  pm.innerHTML = `<div class="card"><p class="kicker">Welcome</p><h1 class="q">Which unit do you work in?</h1>
    <p class="sub">Anonymous: this is the only thing we ask about you.</p>
    <div class="units">${UNITS.map(([c, n]) => `<button class="opt" data-u="${c}">${esc(n)}</button>`).join("")}</div>
    <button class="link" id="skip">Skip</button></div>`;
  pm.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { write(phase, "u", b.dataset.u); });
  pm.querySelector("#skip").onclick = () => { P.unitSkip = true; renderPlayer(); };
}

function progress(done, total) {
  return `<div class="progress">${Array.from({ length: total }, (_, i) => `<i class="${i < done ? "on" : ""}"></i>`).join("")}</div>`;
}

function questionCard(pm, kicker, id, prog, button, onGo) {
  const q = SET.questions[id];
  pm.innerHTML = `<div class="card">${prog}<p class="kicker">${esc(kicker)}</p>
    <h1 class="q">${esc(q.text)}</h1><div class="opts">${q.options.map((o, i) => `<button class="opt ${P.sel === L(i) ? "sel" : ""}" data-a="${L(i)}"><span class="l">${L(i).toUpperCase()}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <button class="go" id="go" ${P.sel ? "" : "disabled"}>${esc(button)}</button></div>`;
  pm.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { P.sel = b.dataset.a; renderPlayer(); });
  pm.querySelector("#go").onclick = () => { if (!P.sel) return; const a = P.sel; P.sel = null; onGo(a); };
}

function renderPre(pm) {
  const pre = P.pre;
  if (!pre.u && !P.unitSkip) return renderUnit(pm, "pre");
  const next = SET.pre.find(id => !pre[id]);
  const prog = progress(SET.pre.filter(id => pre[id]).length + (pre.c ? 1 : 0), SET.pre.length + 1);
  if (next) {
    const n = SET.pre.indexOf(next) + 1;
    questionCard(pm, `Before we start · question ${n} of ${SET.pre.length}`, next, prog, "Next ›", a => write("pre", next, a));
    const note = document.createElement("p"); note.className = "note"; note.textContent = "Answer what you think right now: no looking it up.";
    pm.querySelector(".card").appendChild(note);
    return;
  }
  if (!pre.c) return renderConf(pm, "pre", prog, "Last one");
  pm.innerHTML = `<div class="card center"><div class="big">✅</div><h1 class="q">All done, thank you</h1>
    <p class="sub">Keep this page open. At the end of the talk the final quiz opens here, with the same questions, so we can see what stuck.</p>
    <div class="pulse"><i></i><i></i><i></i></div></div>`;
}

function renderConf(pm, phase, prog, kicker) {
  pm.innerHTML = `<div class="card">${prog || ""}<p class="kicker">${esc(kicker)}</p><h1 class="q">${esc(SET.confidence)}</h1>
    <div class="scale">${CONF_LABELS.map((t, i) => `<button class="opt ${P.sel === String(i + 1) ? "sel" : ""}" data-c="${i + 1}"><b>${i + 1}</b>${esc(t)}</button>`).join("")}</div>
    <button class="go" id="go" ${P.sel ? "" : "disabled"}>Done ›</button></div>`;
  pm.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { P.sel = b.dataset.c; renderPlayer(); });
  pm.querySelector("#go").onclick = async () => { if (!P.sel) return; const c = Number(P.sel); P.sel = null; await write(phase, "c", c); };
}

function renderFinal(pm) {
  const post = P.post;
  const answered = SET.post.filter(id => post[id]).length;
  if (!P.started && !answered && !post.c) {
    const warm = scoreOf(P.pre, SET.pre).done > 0;
    pm.innerHTML = `<div class="card center"><p class="kicker">End of the talk</p><h1 class="q">Final quiz</h1>
      <p class="sub">${SET.post.length} questions at your own pace${warm ? ", including the ones from this morning" : ""}. You'll see the answer after each one.</p>
      <button class="go" id="start">Start the final quiz ›</button></div>`;
    pm.querySelector("#start").onclick = () => { P.started = true; renderPlayer(); };
    return;
  }
  if (!unitOf() && !P.unitSkip) return renderUnit(pm, "post");
  const prog = progress(answered + (post.c ? 1 : 0), SET.post.length + 1);
  if (P.checked) return renderChecked(pm, P.checked, prog);
  const next = SET.post.find(id => !post[id]);
  if (next) {
    const n = SET.post.indexOf(next) + 1;
    return questionCard(pm, `Final quiz · question ${n} of ${SET.post.length}`, next, prog, "Check my answer ›", a => {
      P.local[next] = a; P.post[next] = a; P.checked = next;
      write("post", next, a);
      renderPlayer();
    });
  }
  if (!post.c) return renderConf(pm, "post", prog, "Last one");
  renderDone(pm);
}

function renderChecked(pm, id, prog) {
  const q = SET.questions[id], mine = P.post[id], n = SET.post.indexOf(id) + 1;
  const right = mine === q.answer;
  const opts = q.options.map((o, i) => {
    const a = L(i), cls = a === q.answer ? "right" : (a === mine ? "wrong" : "");
    return `<button class="opt ${cls}" disabled><span class="l">${a.toUpperCase()}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const last = n === SET.post.length;
  pm.innerHTML = `<div class="card">${prog}<p class="kicker">Final quiz · question ${n} of ${SET.post.length}</p>
    <h1 class="q">${esc(q.text)}</h1><div class="opts">${opts}</div>
    <div class="feedback ${right ? "ok" : "no"}"><b class="h">${right ? "✓ Correct!" : "✗ Not quite: it's " + q.answer.toUpperCase()}</b>${esc(q.why)}</div>
    <button class="go" id="go">${last ? "Last one: how confident? ›" : "Next question ›"}</button></div>`;
  pm.querySelector("#go").onclick = () => { P.checked = null; renderPlayer(); };
}

function renderDone(pm) {
  const core = SET.pre;
  const a = scoreOf(P.pre, core), b = scoreOf(P.post, core), all = scoreOf(P.post, SET.post);
  const mine = a.done ? `<div class="score"><div><b>${a.right}/${a.done}</b><span>this morning</span></div>
      <div class="arrow">→</div><div><b>${b.done ? b.right + "/" + b.done : "–"}</b><span>now (same questions)</span></div></div>` : "";
  pm.innerHTML = `<div class="card center"><div class="big">🎉</div><h1 class="q">Thanks for taking part!</h1>${mine}
    <p class="sub">Final quiz: <b>${all.right} out of ${SET.post.length}</b>. Look up at the screen to see how the room did.</p>
    <p class="note">Your answers are anonymous. Questions about today? Ask your clinical practice educator.</p></div>`;
}

// ====================================================================== PRESENTER and RESULTS SCREEN
const H = { state: { p: "pre" }, seen: {}, ans: { pre: {}, post: {} }, menu: false, qr: false, open: null };

async function host() {
  document.body.className = "host";
  app.innerHTML = `<div class="gate"><h1>Connecting…</h1></div>`;
  try { DB = await connect(); } catch (e) { return hostError(e); }
  DB.onConnected(c => { connected = c; renderHost(); });
  DB.onOffset(o => clockOffset = o);
  const key = store.get("lq-key-" + SID);
  if (key && await registerHost(key, false)) return startHost();
  hostGate();
}

function hostError(e) {
  console.error(e);
  app.innerHTML = `<div class="gate"><h1>Can't start the presenter screen</h1><p>${esc(friendlyError(e))}</p>
    <button class="go" onclick="location.reload()">Try again</button></div>`;
}

async function registerHost(key, createIfFree) {
  if (createIfFree) {
    try { await DB.set(ROOT + "/hostkey", key); } catch (e) { /* already set: the key check below decides */ }
    try { await DB.set(ROOT + "/claimed", true); } catch (e) { /* already claimed */ }
  }
  try {
    await DB.set(ROOT + "/hosts/" + DB.uid, key);
    store.set("lq-key-" + SID, key);
    return true;
  } catch (e) { return false; }
}

async function hostGate(msg) {
  let claimed = false;
  try { claimed = !!(await DB.get(ROOT + "/claimed")); } catch (e) { return hostError(e); }
  app.innerHTML = `<div class="gate"><h1>${claimed ? "Presenter key" : "Set up this session"}</h1>
    <p>${claimed ? `Session <b>${esc(SID)}</b> is protected. Type the presenter key you chose when you set it up.`
      : `Session <b>${esc(SID)}</b> hasn't been set up yet. Choose a presenter key (at least 6 characters) — you'll type it once on each device you use as the presenter screen. Do this before the session: whoever sets it first controls the quiz.`}</p>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
    <input id="k1" type="password" autocomplete="current-password" placeholder="Presenter key">
    ${claimed ? "" : `<input id="k2" type="password" autocomplete="new-password" placeholder="Type it again">`}
    <button class="go" id="kgo">${claimed ? "Open presenter screen" : "Create and open"}</button>
    <p style="font-size:13px">Participants join at <b>${esc(JOIN_TEXT)}</b></p></div>`;
  const k1 = document.getElementById("k1"); k1.focus();
  const go = async () => {
    const a = k1.value.trim(), b = claimed ? a : document.getElementById("k2").value.trim();
    if (a.length < (claimed ? 4 : 6)) return hostGate(claimed ? "Type your presenter key." : "Use at least 6 characters.");
    if (a !== b) return hostGate("The two keys don't match.");
    if (await registerHost(a, !claimed)) startHost();
    else hostGate(claimed ? "That key didn't work. Check it and try again." : "Couldn't create the session — has someone else just set it up? Reload and try again.");
  };
  document.getElementById("kgo").onclick = go;
  app.querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") go(); });
}

function listenAll(render, onErr) {
  DB.listen(ROOT + "/state", v => { H.state = v || { p: "pre" }; render(); }, onErr);
  DB.listen(ROOT + "/seen", v => { H.seen = v || {}; render(); }, onErr);
  DB.listen(ROOT + "/ans", v => { H.ans = { pre: (v && v.pre) || {}, post: (v && v.post) || {} }; render(); }, onErr);
  setInterval(() => { if (finalOpen(H.state) !== H.open) render(); }, 1000);
}

function startHost() {
  H.ready = true;
  listenAll(renderHost, hostError);
  document.addEventListener("keydown", hostKeys);
  renderHost();
}

async function setOpen(open) {
  const t = opensAt();
  const st = open ? { p: "final", t: DB.ts() } : { p: "pre", t: DB.ts(), hold: t !== null && now() >= t };
  try { await DB.set(ROOT + "/state", st); } catch (e) { toast(friendlyError(e)); }
}

function hostKeys(e) {
  if (e.target && e.target.tagName === "INPUT") return;
  const k = e.key;
  if (k === "f" || k === "F") fullscreen();
  else if (k === "q" || k === "Q") { H.qr = !H.qr; renderHost(); }
  else if (k === "Escape") { H.menu = false; H.qr = false; renderHost(); }
}

function fullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen && document.exitFullscreen();
}

function people() {
  const ids = new Set([...Object.keys(H.seen || {}), ...Object.keys(H.ans.pre || {}), ...Object.keys(H.ans.post || {})]);
  return ids.size;
}

function unitFor(uid) {
  const u = (H.ans.pre[uid] && H.ans.pre[uid].u) || (H.ans.post[uid] && H.ans.post[uid].u);
  return UNIT_NAME[u] ? u : (u ? "OTH" : null);
}

function summary() {
  const pre = H.ans.pre || {}, post = H.ans.post || {};
  const core = SET.pre;
  const perQ = SET.post.map(id => {
    const tally = side => { let r = 0, n = 0; for (const a of Object.values(side)) { if (a && a[id]) { n++; if (a[id] === SET.questions[id].answer) r++; } } return { r, n }; };
    return { id, pre: core.includes(id) ? tally(pre) : null, post: tally(post) };
  });
  const agg = (side) => { let r = 0, n = 0; for (const a of Object.values(side)) { const s = scoreOf(a, core); r += s.right; n += s.done; } return n ? Math.round(100 * r / n) : null; };
  const conf = side => { const v = Object.values(side).map(a => a && a.c).filter(Boolean); return v.length ? (v.reduce((x, y) => x + y, 0) / v.length) : null; };
  const both = Object.keys(pre).filter(u => scoreOf(pre[u], core).done >= 3 && scoreOf(post[u] || {}, core).done >= 3);
  const matched = side => { let r = 0, n = 0; both.forEach(u => { const s = scoreOf(side[u], core); r += s.right; n += s.done; }); return n ? Math.round(100 * r / n) : null; };
  const nPre = Object.values(pre).filter(a => scoreOf(a, core).done).length;
  const nPost = Object.values(post).filter(a => scoreOf(a, SET.post).done).length;
  const units = {};
  for (const [uid, a] of Object.entries(post)) {
    const s = scoreOf(a, SET.post); if (!s.done) continue;
    const u = unitFor(uid) || "OTH";
    units[u] = units[u] || { r: 0, n: 0, people: 0 };
    units[u].r += s.right; units[u].n += s.done; units[u].people++;
  }
  const league = Object.entries(units).map(([u, v]) => ({ u, pct: Math.round(100 * v.r / v.n), people: v.people }))
    .sort((x, y) => (y.people >= 2) - (x.people >= 2) || y.pct - x.pct);
  const room = { pre: agg(pre), post: agg(post), nPre, nPost, both: both.length,
                 cPre: conf(pre) && Math.round(conf(pre) * 10) / 10, cPost: conf(post) && Math.round(conf(post) * 10) / 10 };
  return { perQ, room, matchedPre: matched(pre), matchedPost: matched(post), league };
}

function qrImg(text) {
  try {
    const q = qrcode(0, "M"); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  } catch (e) { return `<p style="color:#212B32">${esc(text)}</p>`; }
}

function dashboardHtml(compact) {
  const S = summary(), r = S.room;
  const pct = v => v == null ? "–" : v + "%";
  const qrows = S.perQ.map((x, i) => {
    const pr = x.pre && x.pre.n ? Math.round(100 * x.pre.r / x.pre.n) : null;
    const po = x.post.n ? Math.round(100 * x.post.r / x.post.n) : null;
    return `<div class="brow"><span class="lab">Q${i + 1} <span style="font-weight:400;opacity:.8">${esc(SET.questions[x.id].tag || "")}</span></span><div class="btrack">
      ${x.pre ? `<div class="b pre"><i style="width:0" data-w="${pr || 0}"></i><em>${pct(pr)}</em></div>` : `<div class="b pre" style="opacity:.35"><em>new</em></div>`}
      <div class="b post"><i style="width:0" data-w="${po || 0}"></i><em>${pct(po)}</em></div></div></div>`;
  }).join("");
  const league = S.league.map((l, i) => `<div class="lrow"><span class="pos">${l.people >= 2 ? i + 1 : "·"}</span><span>${esc(UNIT_NAME[l.u] || "Other")} <small style="opacity:.7">(${l.people})</small></span><b>${l.people >= 2 ? l.pct + "%" : "–"}</b></div>`).join("");
  const kpis = `<div class="kpi"><div><b>${pct(r.pre)}</b><span>this morning · ${r.nPre} people</span></div><div class="ar">→</div>
      <div class="after"><b>${pct(r.post)}</b><span>now · ${r.nPost} people</span></div></div>
      <div class="mini"><div class="kpi"><div><b>${r.cPre ?? "–"}</b><span>confidence before</span></div><div class="ar">→</div><div class="after"><b>${r.cPost ?? "–"}</b><span>after (out of 5)</span></div></div>
      <div class="kpi"><div><b>${pct(S.matchedPre)}</b><span>same ${r.both} people, before</span></div><div class="ar">→</div><div class="after"><b>${pct(S.matchedPost)}</b><span>after</span></div></div></div>`;
  const leagueBox = `<div class="league"><h2>Unit league (final quiz, 2 or more people)</h2>${league || `<div class="lrow"><span></span><span style="opacity:.7">No answers yet</span><span></span></div>`}</div>`;
  const bars = `<div class="bars"><h2>Correct answers, question by question</h2>
      <div class="legend"><span><i style="background:#9fb4c3"></i>this morning</span><span><i style="background:#7be495"></i>final quiz</span></div>${qrows}</div>`;
  if (compact) return `<div class="res res3"><div>${kpis}</div>${bars}${leagueBox}</div>`;
  return `<div class="res"><div><h1>Did it stick?</h1>${kpis}${leagueBox}</div>${bars}</div>`;
}

function animateBars(viewKey) {
  const els = app.querySelectorAll("[data-w]");
  const animate = viewKey !== H.lastView;
  H.lastView = viewKey;
  els.forEach(el => { if (!animate) el.style.width = el.dataset.w + "%"; });
  if (animate) requestAnimationFrame(() => requestAnimationFrame(() => els.forEach(el => el.style.width = el.dataset.w + "%")));
}

function hostFrame(inner, foot) {
  return `<div class="h-wrap"><div class="h-top"><div class="t">${esc(SET.title)}<small>Live quiz · ${esc(JOIN_TEXT)}</small></div>
    <div class="pill" id="hc"></div><div class="pill"><span class="dot ${connected ? "" : "off"}"></span>${connected ? "Live" : "Reconnecting…"}</div></div>
    <div class="h-main">${inner}</div>
    <div class="h-foot"><div class="hint">${H.open ? "Final quiz open · results update live" : "Final quiz opens by itself " + esc(opensText())} · F full screen · Q show QR</div>
    ${foot}<button class="hbtn" id="hm" aria-label="Menu">⋯</button></div></div>
    ${H.menu ? `<div class="menu"><button id="m-qr">Show join QR code</button><button id="m-csv">Export results (CSV)</button>
      <button id="m-copy">Copy participant link</button><button id="m-screen">Copy results-screen link (for the slide)</button>
      ${isPractice() ? `<button id="m-sample">Add practice answers (${PRACTICE.length} pretend people)…</button>` : ""}
      <button id="m-reset">Reset this session…</button>
      <button id="m-forget">Forget presenter key on this device</button></div>` : ""}
    ${H.qr ? `<div class="overlay" id="ov"><div class="qrbox">${qrImg(JOIN_URL)}<div class="u">${esc(JOIN_TEXT)}</div></div></div>` : ""}`;
}

function renderCounts() {
  const el = document.getElementById("hc");
  if (el) el.textContent = "👥 " + people() + " joined";
  const a = document.getElementById("c-join"); if (a) a.textContent = people();
  const b = document.getElementById("c-pre");
  if (b) b.textContent = Object.values(H.ans.pre || {}).filter(x => x && x.c).length;
}

const WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
const SCREEN_URL = JOIN_URL + (JOIN_URL.includes("?") ? "&" : "?") + (SID === DEFAULT_SESSION ? "s=" + SID + "&" : "") + "mode=screen";

function renderHost() {
  if (!DB || !H.ready) return;
  H.open = finalOpen(H.state);
  let inner, foot;
  if (!H.open) {
    const byUnit = {};
    Object.keys(H.ans.pre).forEach(u => { const k = unitFor(u); if (k) byUnit[k] = (byUnit[k] || 0) + 1; });
    const n = WORDS[SET.pre.length] || SET.pre.length;
    inner = `<div class="lobby"><div class="qrbox">${qrImg(JOIN_URL)}<div class="u">${esc(JOIN_TEXT)}</div></div>
      <div><h1>Scan to join</h1><p>${esc(n[0].toUpperCase() + n.slice(1))} quick questions now. At the end, a final quiz with the same questions, so we can see what stuck.</p>
      <div class="counters"><div class="counter"><b id="c-join">0</b><span>joined</span></div><div class="counter"><b id="c-pre">0</b><span>finished the warm-up</span></div></div>
      <div class="chips">${UNITS.filter(([c]) => byUnit[c]).map(([c, nm]) => `<span class="chip">${esc(nm)} · ${byUnit[c]}</span>`).join("")}</div></div></div>`;
    foot = `<button class="hbtn primary" id="hopen">Open the final quiz now ›</button>`;
  } else {
    inner = dashboardHtml(false);
    foot = `<button class="hbtn" id="hclose">Close the final quiz</button><button class="hbtn" id="hcsv">Export CSV</button>`;
  }
  app.innerHTML = hostFrame(inner, foot);
  animateBars(H.open ? "final" : "pre");
  renderCounts();
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("hopen", () => setOpen(true));
  on("hclose", () => { if (confirm("Close the final quiz? Phones go back to the waiting screen.")) setOpen(false); });
  on("hm", () => { H.menu = !H.menu; renderHost(); });
  on("hcsv", exportCsv); on("m-csv", () => { H.menu = false; exportCsv(); renderHost(); });
  on("m-qr", () => { H.menu = false; H.qr = true; renderHost(); }); on("ov", () => { H.qr = false; renderHost(); });
  on("m-copy", async () => { H.menu = false; try { await navigator.clipboard.writeText(JOIN_URL); toast("Link copied"); } catch (e) { toast(JOIN_URL); } renderHost(); });
  on("m-screen", async () => { H.menu = false; try { await navigator.clipboard.writeText(SCREEN_URL); toast("Results-screen link copied"); } catch (e) { toast(SCREEN_URL); } renderHost(); });
  on("m-forget", () => { store.del("lq-key-" + SID); toast("Key forgotten on this device"); H.menu = false; renderHost(); });
  on("m-reset", resetSession);
  on("m-sample", addPracticeAnswers);
}

// ---------------- results screen: read-only, nothing to click (for Web Viewer on a slide, or a browser tab)
async function screen() {
  document.body.className = "host screen";
  app.innerHTML = `<div class="s-msg">Connecting to the live results…</div>`;
  try { DB = await connect(); } catch (e) { return screenError(e); }
  DB.onConnected(c => { connected = c; renderScreen(); });
  DB.onOffset(o => clockOffset = o);
  H.ready = true;
  listenAll(renderScreen, screenError);
  renderScreen();
}

function screenError(e) {
  console.error(e);
  app.innerHTML = `<div class="s-msg"><div>The live results will appear here.<small>${esc(friendlyError(e))}</small></div></div>`;
}

function renderScreen() {
  if (!DB || !H.ready) return;
  H.open = finalOpen(H.state);
  const r = summary().room;
  const status = H.open ? `<b>${r.nPost}</b> of ${people()} have answered the final quiz`
                        : `The final quiz opens ${esc(opensText())}`;
  app.innerHTML = `<div class="s-wrap"><div class="s-top"><span class="s-title">Live results</span>
      <span class="s-status">${status}</span><span class="dot ${connected ? "" : "off"}"></span>
      <span class="s-join"><span>Not done it yet? <b>${esc(JOIN_TEXT)}</b></span><span class="qr">${qrImg(JOIN_URL)}</span></span></div>
    ${dashboardHtml(true)}</div>`;
  animateBars(H.open ? "final" : "pre");
}

// Practice sessions only (never the real session): pretend people, so a rehearsal shows a full results screen.
// unit, warm-up answers, confidence before, final answers, confidence after. Reset the session to remove them.
const PRACTICE = [
  ["LIS", "acbb", 2, "bcbbb", 4], ["LIS", "babb", 3, "bcbbb", 4], ["STR", "acab", 2, "bcbba", 4], ["STR", "dcbc", 2, "bcbbb", 5],
  ["BED", "abab", 1, "bcbab", 3], ["BED", "bcaa", 2, "bcbbb", 4], ["BED", "acbb", 3, "bcbbb", 4], ["CKC", "adbb", 2, "bcbbb", 4],
  ["CKC", "bcbb", 3, "bcbbb", 5], ["CKC", "dacb", 1, "bcabb", 3], ["HAR", "acba", 2, "bcbbb", 4], ["HAR", "bbbb", 2, "babbb", 4],
  ["STA", "acaa", 2, "bcbbb", 4], ["STA", "dcbb", 3, "bcbbb", 5]
];
function isPractice() { return SID !== DEFAULT_SESSION && !FINAL_OPENS[SID]; }

async function addPracticeAnswers() {
  H.menu = false;
  if (!isPractice()) return renderHost();
  if (!confirm("Add answers from " + PRACTICE.length + " pretend people to practice session " + SID +
               "? They show on the results screen until you reset the session.")) return renderHost();
  const run = Date.now().toString(36);
  try {
    for (let i = 0; i < PRACTICE.length; i++) {
      const [u, a1, c1, a2, c2] = PRACTICE[i];
      const id = "practice-" + run + "-" + i;
      const before = { u, c: c1 }, after = { u, c: c2 };
      SET.pre.forEach((q, k) => { before[q] = a1[k]; });
      SET.post.forEach((q, k) => { after[q] = a2[k]; });
      await DB.set(`${ROOT}/ans/pre/${id}`, before);
      await DB.set(`${ROOT}/ans/post/${id}`, after);
      await DB.set(`${ROOT}/seen/${id}`, DB.ts());
    }
    toast("Added " + PRACTICE.length + " practice answers");
  } catch (e) { toast(friendlyError(e)); }
  renderHost();
}

async function resetSession() {
  H.menu = false;
  if (!confirm("Delete every answer in session " + SID + " and go back to the start?")) return renderHost();
  if (!confirm("Sure? Export the CSV first if you need it. This can't be undone.")) return renderHost();
  try {
    await DB.remove(ROOT + "/ans"); await DB.remove(ROOT + "/seen");
    await DB.set(ROOT + "/state", { p: "pre", t: DB.ts() });
    toast("Session reset");
  } catch (e) { toast(friendlyError(e)); }
}

function exportCsv() {
  const pre = H.ans.pre || {}, post = H.ans.post || {};
  const ids = [...new Set([...Object.keys(pre), ...Object.keys(post)])];
  const head = ["person", "unit", ...SET.pre.map(q => "before_" + q), "before_confidence", ...SET.post.map(q => "after_" + q),
                "after_confidence", "before_score", "after_score_same_questions", "after_score_all"];
  const rows = ids.map((u, i) => {
    const a = pre[u] || {}, b = post[u] || {};
    const sa = scoreOf(a, SET.pre), sb = scoreOf(b, SET.pre), sc = scoreOf(b, SET.post);
    return [i + 1, UNIT_NAME[unitFor(u)] || "", ...SET.pre.map(q => a[q] || ""), a.c || "", ...SET.post.map(q => b[q] || ""), b.c || "",
            sa.done ? sa.right + "/" + sa.done : "", sb.done ? sb.right + "/" + sb.done : "", sc.done ? sc.right + "/" + sc.done : ""];
  });
  const key = ["answer key", "", ...SET.pre.map(q => SET.questions[q].answer), "", ...SET.post.map(q => SET.questions[q].answer), "", "", "", ""];
  const csv = [head, key, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const aEl = document.createElement("a");
  aEl.href = URL.createObjectURL(blob); aEl.download = `livequiz-${SID}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(aEl); aEl.click(); setTimeout(() => { URL.revokeObjectURL(aEl.href); aEl.remove(); }, 500);
}

// ---------------------------------------------------------------- go
window.__lq = { H, P, summary, setOffset: ms => { clockOffset = ms; } };
({ host, screen }[MODE] || player)();
</script>
